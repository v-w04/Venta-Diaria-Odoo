<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  :root{ --bg:#fff; --fg:#1a1a1a; --muted:#6b6b6b; --line:#e6e6e6; --acc:#0a66c2; --ok:#1e8e3e; --danger:#c0392b; --soft:#f7f8fa; }
  *{box-sizing:border-box}
  body{margin:0;padding:16px;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);background:var(--bg)}
  h1{font-size:16px;margin:0 0 2px} .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
  label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 3px}
  select,input[type=text],input[type=number]{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font:inherit}
  .fila{display:flex;gap:10px} .fila > div{flex:1}
  .checks{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
  .checks label{display:flex;align-items:center;gap:6px;margin:0;color:var(--fg);font-size:13.5px;cursor:pointer}
  .hint{font-size:12px;color:var(--muted);margin-top:3px}
  .reglas{margin:12px 0;border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:8px 10px}
  .reglas h2{font-size:13px;margin:0 0 6px}
  .regla{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #eee;font-size:13px}
  .regla:last-child{border-bottom:0}
  .acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  button{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}
  button:hover{background:var(--soft)} button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
  button:disabled{opacity:.5;cursor:default}
  .x{background:none;border:none;color:var(--danger);cursor:pointer;padding:0 4px}
  #msg{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:13px;display:none;white-space:pre-wrap}
  #msg.ok{display:block;background:#e6f4ea;border:1px solid #b7e1c4} #msg.err{display:block;background:#fdecea;border:1px solid #f5c6c2}
</style>
</head>
<body>
<h1>🏷️ Armar carga de promociones</h1>
<p class="sub">Elige la categoría y la regla. Puedes sumar varias categorías y al final se arma una sola hoja lista para el site.</p>

<div id="reglas" class="reglas" style="display:none"><h2>Reglas agregadas</h2><div id="lista"></div></div>

<label>Categoría</label>
<select id="cat"><option value="">— elegir —</option></select>
<div class="hint" id="hintCat"></div>

<div class="fila">
  <div><label>Reducción de comisión (puntos)</label><input type="number" id="pts" min="0" step="0.5" placeholder="7 = 7%"></div>
  <div><label>Stock mínimo (Odoo)</label><input type="number" id="stk" min="0" step="1" value="4"></div>
</div>

<label>Solo estas marcas (opcional, prefijo del SKU)</label>
<input type="text" id="mar" placeholder="Ej. DJI, NIK, CAN — vacío = todas">

<div class="checks">
  <label><input type="checkbox" id="cla" checked> Clásicas</label>
  <label><input type="checkbox" id="pre" checked> Premium (-MSI)</label>
  <label><input type="checkbox" id="kil"> Incluir las que ya tienen killer</label>
</div>
<div class="hint">El SKU sale sin -MSI. Solo entran los que Walmart tiene en esa categoría.</div>

<div class="acciones">
  <button id="bAgregar">➕ Agregar y capturar otra categoría</button>
  <button id="bGenerar" class="pri">Generar hoja</button>
  <button id="bCerrar">Cancelar</button>
</div>
<div id="msg"></div>

<script>
  var CATS = {}, REGLAS = [];
  function $(i){ return document.getElementById(i); }
  function msg(t, ok){ var m=$('msg'); m.className = ok ? 'ok' : 'err'; m.textContent = t; }
  function pinta(){
    $('reglas').style.display = REGLAS.length ? 'block' : 'none';
    $('lista').innerHTML = '';
    REGLAS.forEach(function(r, i){
      var d = document.createElement('div'); d.className = 'regla';
      var t = '<span><b>' + r.categoria + '</b> · ' + r.puntos + ' pts · ' + (r.clasicas?'clásicas ':'') + (r.premium?'premium ':'') +
              (r.conKiller?'· con killer ':'') + (r.marcas?'· ' + r.marcas + ' ':'') + '· stock ≥ ' + r.stockMin + '</span>';
      d.innerHTML = t + '<button class="x" data-i="' + i + '">✕</button>';
      $('lista').appendChild(d);
    });
    [].forEach.call(document.querySelectorAll('.x'), function(b){ b.onclick = function(){ REGLAS.splice(Number(b.dataset.i),1); pinta(); }; });
  }
  function formulario(){
    var c = $('cat').value; if (!c) return null;
    return { categoria: c, puntos: $('pts').value, marcas: $('mar').value, clasicas: $('cla').checked, premium: $('pre').checked,
             conKiller: $('kil').checked, stockMin: $('stk').value === '' ? 4 : Number($('stk').value) };
  }
  function limpia(){ $('cat').value=''; $('pts').value=''; $('mar').value=''; $('cla').checked=true; $('pre').checked=true; $('kil').checked=false; $('stk').value=4; $('hintCat').textContent=''; }
  function valida(r){
    if (!(Number(r.puntos) > 0)) { var c = CATS[r.categoria]; if (!c || !(Number(c.puntos) > 0)) return 'Falta la reducción (puntos) de ' + r.categoria + '.'; r.puntos = c.puntos; }
    if (!r.clasicas && !r.premium) return 'Marca al menos clásicas o premium.';
    return '';
  }
  $('cat').onchange = function(){
    var c = CATS[$('cat').value]; if (!c) { $('hintCat').textContent=''; return; }
    if (c.puntos) $('pts').value = c.puntos; else $('pts').value = '';
    $('hintCat').textContent = 'Comisión normal ' + (c.comision || '?') + '%' + (c.puntos ? ' · promo en COMISIONES: ' + c.puntos + ' pts' : ' · sin promo capturada') +
                               (c.soloKillers ? ' · marcada SOLO EN KILLERS (normalmente no se carga)' : '');
  };
  $('bAgregar').onclick = function(){
    var r = formulario(); if (!r) { msg('Elige una categoría.', false); return; }
    var e = valida(r); if (e) { msg(e, false); return; }
    REGLAS.push(r); pinta(); limpia(); $('msg').className=''; $('msg').textContent='';
  };
  $('bGenerar').onclick = function(){
    var r = formulario();
    if (r) { var e = valida(r); if (e) { msg(e, false); return; } REGLAS.push(r); pinta(); limpia(); }
    if (!REGLAS.length) { msg('Agrega al menos una categoría.', false); return; }
    $('bGenerar').disabled = true; $('bAgregar').disabled = true; msg('Armando la hoja… (puede tardar un poco)', true);
    google.script.run.withSuccessHandler(function(res){
      var t = 'Listo. Hoja CARGA PROMOCIONES armada.\n\nLISTOS para cargar: ' + res.listos + ' SKUs base (' + res.nuevos + ' todavía no están en el site)\nNo se cargan: ' + res.noCargar + '\n';
      res.porRegla.forEach(function(p){ t += '\n· ' + p.categoria + ' (' + p.puntos + ' pts): ' + p.listos; });
      t += '\n\nCopia A:C de los renglones LISTO y pégalos en "Cargar promociones" del site.';
      msg(t, true); $('bGenerar').textContent = 'Cerrar'; $('bGenerar').disabled = false; $('bGenerar').onclick = function(){ google.script.host.close(); };
    }).withFailureHandler(function(err){
      msg('No se pudo armar: ' + (err && err.message ? err.message : err), false); $('bGenerar').disabled = false; $('bAgregar').disabled = false;
    }).cpGenerar(REGLAS);
  };
  $('bCerrar').onclick = function(){ google.script.host.close(); };
  google.script.run.withSuccessHandler(function(o){
    var s = $('cat');
    o.categorias.forEach(function(c){ CATS[c.nombre] = c; var op = document.createElement('option'); op.value = c.nombre; op.textContent = c.nombre; s.appendChild(op); });
  }).withFailureHandler(function(err){ msg('No se pudieron leer las categorías: ' + (err && err.message ? err.message : err), false); }).cpOpciones();
</script>
</body>
</html>
